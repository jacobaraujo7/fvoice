name: FVoice
options:
  bundleIdPrefix: com.jacobmoura
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: U843T2P7A2
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.9.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  FVoice:
    type: application
    platform: macOS
    sources:
      - path: FVoice
    dependencies:
      - package: WhisperKit
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobmoura.fvoice
        INFOPLIST_FILE: FVoice/App/Info.plist
        ENABLE_HARDENED_RUNTIME: false
        GENERATE_INFOPLIST_FILE: false
  FVoiceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FVoiceTests
    dependencies:
      - target: FVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobmoura.fvoice.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  FVoice:
    build:
      targets:
        FVoice: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FVoiceTests
